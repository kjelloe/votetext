<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>VoteText</title>
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header id="app-header">
        <div class="header-inner">
            <a href="#/documents" class="logo">VoteText</a>
            <nav id="app-nav">
                <a href="#/documents" class="nav-link" data-route="documents">Documents</a>
                <a href="#/activity" class="nav-link" data-route="activity">Activity <span id="act-badge" class="nav-badge hidden"></span></a>
            </nav>
            <div id="user-area">
                <button id="login-btn" class="btn btn-primary">Log in</button>
                <div id="user-menu" class="hidden">
                    <span id="user-name-display"></span>
                    <a href="#/admin/users" id="nav-users-link" class="nav-link hidden">Users</a>
                    <a href="#/profile" class="nav-link">Profile</a>
                    <button id="logout-btn" class="btn btn-ghost">Log out</button>
                </div>
            </div>
            <button id="theme-toggle" class="btn btn-ghost btn-icon" type="button" aria-pressed="false" aria-label="Switch to dark mode" title="Switch to dark mode">
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
        </div>
    </header>

    <main id="app-main" role="main">
        <div class="loading-spinner">Loading…</div>
    </main>

    <footer class="app-footer">
        <span>VoteText — collaborative text voting</span>
        <span id="tutorial-links" class="footer-links"></span>
        <em class="footer-credit">original idea by Kjell &amp; Robert</em>
    </footer>

    <div id="toast-container"></div>

    <div id="modal-overlay" class="hidden">
        <div id="modal-box">
            <button id="modal-close" class="btn btn-ghost modal-close-btn">&times;</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script src="/app.js"></script>
    <script src="/auth.js"></script>
    <script src="/review.js"></script>
    <script src="/selection.js"></script>
</body>
</html>
